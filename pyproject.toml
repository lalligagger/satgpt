[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satgpt"
dynamic = ["version"]
description = "GPT for satellite imagery: a shell-gpt role that writes stac-client searches and a stacker CLI for GIFs. Alpha."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Kevin Lalli", email = "kevinlalli@pm.me" }]
keywords = ["stac", "satellite", "sentinel-2", "landsat", "llm", "shell-gpt", "earth-observation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  # Floors are the versions a fresh install resolved to and passed the smoke test with on 2026-10-16
  # (Python 3.14, arm64 macOS; CI repeats it on 3.12, 3.13 and 3.14). rasterio 1.5 needs Python >= 3.12,
  # which sets requires-python. See constraints.txt for the full set.
  "fire>=0.7.1",
  "dask>=2026.8.0",
  "pystac>=1.15.2",
  "pystac-client>=0.9.0",
  "rasterio>=1.5.2",
  "stackstac>=0.5.1",
  "shell-gpt>=1.5.1",
  "click>=8.5.0",
  "distro>=1.9; sys_platform == 'linux'",
]

[project.optional-dependencies]
# BROKEN until geogif relaxes numpy<2 (TODO.md): rasterio>=1.5 needs numpy>=2, so pip cannot resolve this
# extra today. Kept so the name is reserved; `pip install satgpt[gif]` fails with a clear conflict.
gif = ["geogif>=0.3"]
# stacterm 0.1.0 pins pandas~=1.2: no wheels for Python >= 3.12 and it conflicts with stackstac>=0.5 (TODO.md).
stacterm = ["stacterm"]

[project.urls]
Homepage = "https://github.com/lalligagger/satgpt"
Changelog = "https://github.com/lalligagger/satgpt/blob/main/CHANGELOG.rst"
"Web app" = "https://github.com/lalligagger/satgpt-app"
Demo = "https://kevinlalli.me/satgpt-app/"

[project.scripts]
satgpt-role = "satgpt.make_role:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "satgpt.version.__version__" }
